<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1a56db"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base rounded icon background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle tricolor accent strip on top -->
  <rect x="120" y="44" width="90" height="8" rx="4" fill="#ff9933"/>
  <rect x="215" y="44" width="82" height="8" rx="4" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="302" y="44" width="90" height="8" rx="4" fill="#138808"/>

  <!-- Train Body -->
  <g filter="url(#shadow)">
    <!-- Main locomotive silhouette -->
    <path d="M168 116 C168 96, 344 96, 344 116 L356 316 C356 348, 156 348, 156 316 Z" fill="url(#trainGrad)"/>
    
    <!-- Windshield -->
    <path d="M184 136 C184 126, 328 126, 328 136 L334 204 C334 212, 178 212, 178 204 Z" fill="#0f172a"/>
    <rect x="252" y="132" width="8" height="76" fill="#475569" rx="2"/>

    <!-- Central BR Emblem / Badge -->
    <rect x="220" y="224" width="72" height="28" rx="6" fill="#1e3a8a"/>
    <text x="256" y="244" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" text-anchor="middle" letter-spacing="2">BR</text>

    <!-- Headlights -->
    <circle cx="196" cy="276" r="16" fill="#fbbf24"/>
    <circle cx="196" cy="276" r="8" fill="#ffffff"/>
    <circle cx="316" cy="276" r="16" fill="#fbbf24"/>
    <circle cx="316" cy="276" r="8" fill="#ffffff"/>

    <!-- Center lower light -->
    <circle cx="256" cy="292" r="10" fill="#f8fafc"/>

    <!-- Cowcatcher / Buffer beam -->
    <path d="M160 326 L352 326 L368 376 C368 382, 360 388, 350 388 L162 388 C152 388, 144 382, 144 376 Z" fill="#334155"/>
    <line x1="184" y1="340" x2="168" y2="382" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="220" y1="340" x2="210" y2="382" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="256" y1="340" x2="256" y2="382" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="292" y1="340" x2="302" y2="382" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="328" y1="340" x2="344" y2="382" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

    <!-- Rails -->
    <line x1="120" y1="420" x2="392" y2="420" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
    <line x1="90" y1="454" x2="422" y2="454" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
    <line x1="170" y1="420" x2="150" y2="454" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <line x1="228" y1="420" x2="220" y2="454" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <line x1="284" y1="420" x2="292" y2="454" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <line x1="342" y1="420" x2="362" y2="454" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
